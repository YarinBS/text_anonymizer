# Overrides of config/config.yaml for the HY injections file (injections_merged): same as config/hy.yaml, other text columns.
# Run: python src/main.py --config config/hy_injections.yaml --data-path <csv>
COLUMNS_TO_DEIDENTIFY: ["summary_and_discussion", "comment", "current_disease", "Unnamed: 12", "Unnamed: 13"]

NAME_LISTS: true
SAFE_TEXT_MATCHING: true
REGEX_BACKSTOP: true
DATE_MODE: keep
FLAGS_COLUMN: true
SAVE_EXTRACTIONS: true
SHARE_COLUMNS: []

# Gemma-4-12B (Q8) on a parallel Ollama server.
BACKEND: ollama
OLLAMA_CONFIG:
  HOST: http://127.0.0.1:11502
  MODEL: gemma4-12b-q8
  NUM_PARALLEL: 16
