# Config for the HY injections file (injections_merged): every privacy switch on, dates kept in the text.
# Run: set HOSPITAL_CONFIG: hy_injections in config/config.yaml, then python src/main.py
DATA_PATH: FILL_ME         # the input CSV
COLUMNS_TO_DEIDENTIFY: ["summary_and_discussion", "comment", "current_disease", "Unnamed: 12", "Unnamed: 13"]

NAME_LISTS: true           # patient_name / doctor_name return every form (lists) instead of one string
SAFE_TEXT_MATCHING: true   # longest value first, never inside placeholders, short names only as whole words
REGEX_BACKSTOP: true       # phones, emails, URLs, Israeli IDs (check digit), "בן/בת/גיל NN" after the LLM
DATE_MODE: keep            # dates stay in the text (the HY caption pipeline reads them)
FLAGS_COLUMN: true         # add <column>_deid_flags (unmatched fields, backstop hits; no values)
SAVE_EXTRACTIONS: true     # write <input>_extractions.jsonl (contains PII; internal), for REUSE_EXTRACTIONS
REUSE_EXTRACTIONS: null    # a <input>_extractions.jsonl = skip the model, only re-apply replacement; set back to null after
SHARE_COLUMNS: []          # no shareable file for HY

# Inference backend: "vllm" (Linux servers, MODEL_PATH) or "ollama" (e.g. the Windows hospital machine, OLLAMA_CONFIG)
BACKEND: ollama

OLLAMA_CONFIG:
  HOST: http://127.0.0.1:11502   # our parallel Ollama server
  MODEL: gemma4-12b-q8           # Ollama model tag (from `ollama create`)
  NUM_PARALLEL: 16               # Parallel requests; match the server's OLLAMA_NUM_PARALLEL (H200: room for 16 slots)
  OPTIONS: {
    "num_ctx": 8192,       # Prompt is ~3k tokens + note (max ~0.7k) + JSON; Ollama silently cuts longer prompts
    "num_predict": 1024,   # Same as VLLM max_tokens
    "temperature": 0,
    "seed": 0,
  }
